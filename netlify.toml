[build]
  functions = "netlify/functions"
  publish = "."
  command = "echo 'Build completed'"

[build.environment]
  # Node 18 esta fuera de soporte. 20 trae fetch y crypto.scryptSync estables.
  NODE_VERSION = "20"

# ── Cabeceras de seguridad del sitio ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # CSP: scripts solo del propio sitio y de los 2 CDN usados (Chart.js, jsPDF,
    # html2canvas). 'unsafe-inline' sigue siendo necesario porque las páginas usan
    # <script> embebido y onclick="..."; aun así se bloquea cargar scripts de
    # dominios ajenos, enviar datos a servidores externos (connect-src 'self'),
    # incrustar el sitio en otro (frame-ancestors) y cambiar la <base> de las URL.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    # X-XSS-Protection se retiro: esta obsoleta y los navegadores modernos
    # la ignoran o se comportan peor con ella activada.

# Las respuestas de las funciones nunca deben quedar en cache
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    # Access-Control-Allow-Origin se retiro de aqui a proposito:
    # cada funcion decide el origen permitido segun ALLOWED_ORIGINS.
    # Dejarlo en "*" aqui anulaba ese control.

# ── Archivos que no deben servirse al publico ─────────────────────────
[[redirects]]
  from = "/set.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_local/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# Documentación interna (describe la arquitectura y las defensas)
[[redirects]]
  from = "/LEEME-IMPLEMENTACION.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OPTIMIZACION-RENDIMIENTO.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# ── URLs amigables ────────────────────────────────────────────────────
[[redirects]]
  from = "/portal"
  to = "/Portal-solicitudes.html"
  status = 200

[[redirects]]
  from = "/gestion"
  to = "/portal-gestion.html"
  status = 200

[[redirects]]
  from = "/movil"
  to = "/AppMovil.html"
  status = 200
