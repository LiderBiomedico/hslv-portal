[build]
  functions = "netlify/functions"
  publish = "."
  command = "echo 'Build completed'"

[build.environment]
  # Node 18 esta fuera de soporte. 20 trae fetch y crypto.scryptSync estables.
  NODE_VERSION = "20"

# ── Cabeceras de seguridad del sitio ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    # X-XSS-Protection se retiro: esta obsoleta y los navegadores modernos
    # la ignoran o se comportan peor con ella activada.

# Las respuestas de las funciones nunca deben quedar en cache
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    # Access-Control-Allow-Origin se retiro de aqui a proposito:
    # cada funcion decide el origen permitido segun ALLOWED_ORIGINS.
    # Dejarlo en "*" aqui anulaba ese control.

# ── Archivos que no deben servirse al publico ─────────────────────────
[[redirects]]
  from = "/set.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_local/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# ── URLs amigables ────────────────────────────────────────────────────
[[redirects]]
  from = "/portal"
  to = "/Portal-solicitudes.html"
  status = 200

[[redirects]]
  from = "/gestion"
  to = "/portal-gestion.html"
  status = 200

[[redirects]]
  from = "/movil"
  to = "/AppMovil.html"
  status = 200
